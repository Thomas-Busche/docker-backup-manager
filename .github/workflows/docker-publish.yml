name: Build & publish Docker image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Real rclone + restic binaries, so tests/test_connectors_real_rclone.py
      # exercises SFTP/WebDAV/FTP targets against real local servers.
      # Official rclone build, same as the Docker image: the Ubuntu package is
      # built without `rclone serve ftp`, which the FTP tests need.
      - name: Install rclone and restic
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 755 /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version
          sudo apt-get update && sudo apt-get install -y restic

      - name: Run tests
        run: python -m pytest -q

  build-and-push:
    # Never publish an image whose tests fail, and never publish from a PR.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and compute image name
        id: meta
        run: |
          VERSION=$(grep 'APP_VERSION' app/config.py | grep -oP '"\K[^"]+')
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER,,}/docker-backup-manager"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Building $IMAGE:$VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
